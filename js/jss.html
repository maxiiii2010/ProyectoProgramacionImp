<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p class="texto">Primer Parrafo</p>
    <p class="texto">Segundo Parrafo</p>

    <script>
        let elementos = document.getElementsByClassName("texto")

        elementos(0).style.color = "red"
        elementos(1).style.color = "blue"      
    </script>
</body>
</html>
